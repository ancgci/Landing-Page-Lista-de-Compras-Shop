    <script>
        // Função para verificar se as imagens estão carregando corretamente
        function checkImages(containerId, statusId) {
            const container = document.getElementById(containerId);
            const statusElement = document.getElementById(statusId);
            const flags = container.querySelectorAll('img');
            
            let loadedCount = 0;
            let errorCount = 0;
            let totalImages = flags.length;
            
            flags.forEach((flag, index) => {
                flag.onload = function() {
                    loadedCount++;
                    updateStatus();
                };
                
                flag.onerror = function() {
                    errorCount++;
                    updateStatus();
                };
            });
            
            function updateStatus() {
                if (loadedCount + errorCount === totalImages) {
                    if (errorCount === 0) {
                        statusElement.innerHTML = `Todas as bandeiras carregaram com sucesso! (${loadedCount}/${totalImages})`;
                        statusElement.className = 'status success';
                    } else {
                        statusElement.innerHTML = `Erro ao carregar ${errorCount} bandeira(s). Carregadas: ${loadedCount}/${totalImages}`;
                        statusElement.className = 'status error';
                    }
                }
            }
            
            // Timeout para verificar se todas as imagens foram processadas
            setTimeout(updateStatus, 3000);
        }
        
        // Iniciar verificação quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar cada teste
            setTimeout(() => checkImages('test-container', 'status1'), 500);
            setTimeout(() => checkImages('test-container', 'status2'), 1000);
            setTimeout(() => checkImages('test-container', 'status3'), 1500);
        });
    </script>
